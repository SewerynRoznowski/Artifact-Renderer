name: Bracket Assembly
description: Mounting bracket for the antenna deployment mechanism.
doc: about.md

sections:
  # A plan-view drawing, as an HTML fragment. Inline SVG, so it scales
  # and picks up the page's light or dark theme.
  - type: html
    path: envelope.html
    description: Keep-out envelope, plan view.

  # The .glb was exported in metres but still Z-up, the way a CAD export
  # usually lands, so `up: z` stands it upright. `camera` is the direction
  # to look from - the distance is fitted to the model, so the same vector
  # works whatever size the part is.
  - type: 3dmodel
    path: bracket-v2.glb
    description: As-built revision, superseding the v1 bracket.
    options:
      camera: [0.4, 0.3, 1.2]
      up: z

  # Page 1 of a two-page document. The served PDF is one page long, not a
  # two-page one opened at the top.
  - type: pdf
    path: torque-spec.pdf
    description: Fastener torque schedule (inspection and rework are on page 2).
    options:
      pages: "1"
      height: 560

  - type: markdown
    path: assembly-notes.md
    description: Assembly sequence and handling.
