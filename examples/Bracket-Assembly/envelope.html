<!-- An HTML *fragment*, which is what an `html` section wants: it drops
     straight into the page. (A complete document with its own <html> and
     <head> also works - the renderer lifts out the <body> and says so -
     but a fragment is the clean case.)

     currentColor throughout, so the drawing follows the page's light or
     dark theme instead of fighting it. -->
<svg viewBox="0 0 320 180" width="320" height="180"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Bracket keep-out envelope, plan view">
  <rect x="20" y="20" width="280" height="140" fill="none"
        stroke="currentColor" stroke-dasharray="6 4" stroke-width="1.5"/>
  <rect x="60" y="50" width="200" height="80" rx="6" fill="none"
        stroke="currentColor" stroke-width="2"/>
  <circle cx="90" cy="90" r="7" fill="none" stroke="currentColor"
          stroke-width="2"/>
  <circle cx="230" cy="90" r="7" fill="none" stroke="currentColor"
          stroke-width="2"/>
  <text x="160" y="16" font-size="11" text-anchor="middle"
        fill="currentColor">keep-out 280 × 140</text>
  <text x="160" y="95" font-size="11" text-anchor="middle"
        fill="currentColor">bracket 200 × 80</text>
  <text x="90" y="115" font-size="10" text-anchor="middle"
        fill="currentColor">M4</text>
  <text x="230" y="115" font-size="10" text-anchor="middle"
        fill="currentColor">M4</text>
</svg>
