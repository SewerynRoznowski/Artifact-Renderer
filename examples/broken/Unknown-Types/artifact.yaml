# BROKEN ON PURPOSE. Not an example to copy.
#
# A section type nobody implements. The message lists the types that do
# exist, because the usual cause is a typo and the usual fix is reading
# the list.
#
# The renderer also distinguishes a *pending* type - one this project has
# named but not built - from an unknown one, since telling an engineer
# "unknown type" about something merely unbuilt sends them hunting for a
# spelling mistake that isn't there. There is no example of that here
# because every type the spec names is now built.

name: "Broken: unknown types"
description: Section types that no renderer knows.

sections:
  - type: step
    path: bracket.step
    description: No renderer for this - a browser cannot draw B-rep CAD.

  - type: mardown
    path: notes.md
    description: A plain typo, and the message lists the types that exist.
